[project]
name = "outlook-manager"
version = "0.1.0"
description = "FastAPI-based Outlook email management system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[all]==0.104.1",
    "httpx==0.25.2",
    "aioimaplib==2.0.1",
    "pydantic[email]>=2.10,<3",
    "requests==2.31.0",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
]

[tool.uv]
package = false
